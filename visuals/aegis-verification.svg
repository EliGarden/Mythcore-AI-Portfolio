<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530"><rect width="100%" height="100%" fill="#f7f9fb"/><text x="40" y="48" font-family="sans-serif" font-size="25" font-weight="700" fill="#172333">Aegis: separate the claim being checked</text><text x="40" y="77" font-family="sans-serif" font-size="14" fill="#4b5c6c">Editorial rule walkthrough - not a screenshot or a new executed result.</text><rect x="40" y="100" width="920" height="82" rx="9" fill="white" stroke="#c9d4de"/><circle cx="72" cy="140" r="18" fill="#126F75"/><text x="72" y="145" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white">1</text><text x="110" y="131" font-family="sans-serif" font-size="19" font-weight="700" fill="#172333">Integrity consistency</text><text x="110" y="158" font-family="sans-serif" font-size="15" fill="#4b5c6c">Are artifact hashes, references and identities internally consistent?</text><rect x="40" y="205" width="920" height="82" rx="9" fill="white" stroke="#c9d4de"/><circle cx="72" cy="245" r="18" fill="#126F75"/><text x="72" y="250" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white">2</text><text x="110" y="236" font-family="sans-serif" font-size="19" font-weight="700" fill="#172333">Semantic reconstruction</text><text x="110" y="263" font-family="sans-serif" font-size="15" fill="#4b5c6c">Does the branch agree with the registered engine and source parent?</text><rect x="40" y="310" width="920" height="82" rx="9" fill="white" stroke="#c9d4de"/><circle cx="72" cy="350" r="18" fill="#126F75"/><text x="72" y="355" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white">3</text><text x="110" y="341" font-family="sans-serif" font-size="19" font-weight="700" fill="#172333">Exact authority content</text><text x="110" y="368" font-family="sans-serif" font-size="15" fill="#4b5c6c">Are the relevant engine, registry, template and policy bytes bound?</text><rect x="40" y="415" width="920" height="82" rx="9" fill="white" stroke="#c9d4de"/><circle cx="72" cy="455" r="18" fill="#126F75"/><text x="72" y="460" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white">4</text><text x="110" y="446" font-family="sans-serif" font-size="19" font-weight="700" fill="#172333">Explicit limit</text><text x="110" y="473" font-family="sans-serif" font-size="15" fill="#4b5c6c">Passing these checks does not establish real authorization or legitimacy.</text></svg>